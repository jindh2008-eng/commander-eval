<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지휘관 자격인증제 평가</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #f8f9fb;
      --panel: #ffffff;
      --border: #e5e8ed;
      --border-light: #eef0f4;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-subtle: #eff4ff;
      --success: #059669;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --warning-border: #fde68a;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Malgun Gothic", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .top-fixed-wrap {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 500;
      background: var(--bg);
    }

    .topbar {
      background: #0f172a;
      color: white;
      padding: 16px 20px 14px;
    }

    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
    }

    .topbar-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .review-link-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.12);
      transition: background 0.15s;
      white-space: nowrap;
    }

    .review-link-btn:not(.disabled):hover {
      background: rgba(255,255,255,0.15);
      text-decoration: none;
    }

    .review-link-btn.disabled {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }

    .topbar-sub { margin-top: 12px; }

    .token-box {
      background: rgba(251,191,36,0.1);
      border: 1px solid rgba(251,191,36,0.2);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-weight: 600;
      line-height: 1.5;
      font-size: 13px;
      word-break: keep-all;
      color: #fbbf24;
    }

    .score-wrap {
      background: rgba(248,249,251,0.95);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      padding: 12px 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    .score-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    .score-box {
      flex: 1;
      background: var(--panel);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-weight: 500;
      color: var(--text-secondary);
      text-align: center;
      font-size: 13px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      line-height: 1;
    }

    .score-box span {
      display: block;
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.03em;
      margin-top: 2px;
    }

    .score-box:last-child span {
      color: var(--text-primary);
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 220px 16px 120px;
      overflow: visible;
    }

    .card {
      background: var(--panel);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      overflow: visible;
    }

    .title-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .sheet-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.35;
    }

    .notice {
      color: var(--text-secondary);
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.6;
    }

    .score-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .group-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--panel);
      overflow: hidden;
    }

    .group-header {
      width: 100%;
      border: none;
      background: #0f172a;
      color: white;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      letter-spacing: -0.01em;
    }

    .group-header.app-collapsible { cursor: pointer; }

    .group-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .group-progress {
      font-size: 12px;
      font-weight: 600;
      background: rgba(255,255,255,0.1);
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .group-progress.is-complete {
      background: rgba(5,150,105,0.3);
      color: #6ee7b7;
    }

    .group-arrow {
      font-size: 13px;
      flex-shrink: 0;
      transition: transform 0.2s ease;
      opacity: 0.6;
    }

    .group-card.collapsed .group-arrow {
      transform: rotate(-90deg);
    }

    .score-item.is-checked {
      border-color: var(--success-border);
      background: var(--success-bg);
    }

    .group-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f8f9fb;
    }

    .group-card.collapsed .group-body { display: none; }

    .score-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--panel);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .score-item:hover {
      border-color: #d1d5db;
    }

    .score-item-head {
      flex: 1;
      min-width: 0;
      padding: 0;
    }

    .behavior-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 2px;
      color: var(--text-primary);
      word-break: keep-all;
    }

    .score-meta {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .grade-buttons {
      display: flex;
      gap: 6px;
      padding: 0;
      flex-shrink: 0;
    }

    .grade-option { position: relative; flex: none; }

    .grade-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .grade-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      min-width: 52px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--panel);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      color: var(--text-muted);
    }

    .grade-label:hover {
      border-color: #c5cad1;
      color: var(--text-secondary);
      background: #f8f9fb;
    }

    .grade-option input:checked + .grade-label {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37,99,235,0.2);
    }

    .grade-option.high input:checked + .grade-label {
      border-color: var(--success);
      background: var(--success);
      color: #fff;
      box-shadow: 0 2px 8px rgba(5,150,105,0.2);
    }

    .grade-option.mid input:checked + .grade-label {
      border-color: var(--warning);
      background: var(--warning);
      color: #fff;
      box-shadow: 0 2px 8px rgba(217,119,6,0.2);
    }

    .grade-option.low input:checked + .grade-label {
      border-color: var(--danger);
      background: var(--danger);
      color: #fff;
      box-shadow: 0 2px 8px rgba(220,38,38,0.2);
    }

    .comment-toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
      position: relative;
    }

    .comment-toggle-btn:hover {
      border-color: #c5cad1;
      color: var(--text-secondary);
      background: #f8f9fb;
    }

    .comment-toggle-btn.has-comment {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-subtle);
    }

    .comment-toggle-btn.has-comment::after {
      content: "";
      position: absolute;
      top: 4px;
      right: 4px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .item-comment-wrap {
      width: 100%;
      padding: 0 18px 14px;
    }

    .score-item {
      flex-wrap: wrap;
    }

    .item-comment {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      min-height: 60px;
      background: #fafbfc;
      transition: border-color 0.15s;
      color: var(--text-primary);
    }

    .item-comment:focus {
      border-color: #6b8afd;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
      background: var(--panel);
    }

    .comment-box { margin-top: 20px; }

    .comment-box label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
    }

    .comment-box textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      min-height: 100px;
      resize: vertical;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .comment-box textarea:focus {
      border-color: #6b8afd;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
    }

    .status-text {
      margin-top: 14px;
      font-weight: 600;
      line-height: 1.5;
      word-break: keep-all;
      font-size: 14px;
    }

    .bottom-bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 400;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
    }

    .actions {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 10px;
    }

    button.action-btn {
      border: none;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      color: white;
      background: var(--accent);
      transition: background 0.15s, transform 0.1s;
    }

    button.action-btn:hover { background: var(--accent-hover); }
    button.action-btn:active { transform: scale(0.98); }

    button.action-btn.secondary {
      background: var(--panel);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    button.action-btn.secondary:hover {
      background: #f1f3f6;
      color: var(--text-primary);
    }

    button.action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      .topbar { padding: 14px 14px 12px; }
      .topbar h1 { font-size: 18px; }
      .score-wrap { padding: 10px 12px 12px; }
      .score-inner { gap: 8px; }
      .score-box { font-size: 12px; padding: 12px 8px; }
      .score-box span { font-size: 24px; }
      .container { padding-top: 205px; }
      .card { padding: 14px; }
      .sheet-title { font-size: 19px; }
      .score-item {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 14px;
      }
      .behavior-title { font-size: 14px; }
      .grade-buttons { justify-content: flex-start; }
      .grade-label { height: 34px; min-width: 48px; padding: 0 13px; font-size: 13px; }
      .comment-toggle-btn { width: 34px; height: 34px; }
      .item-comment-wrap { padding: 0 14px 12px; }
      .actions { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <script>
    if (!new URLSearchParams(window.location.search).get("token")) {
      window.location.replace("admin-main.html");
    }
  </script>
  <div class="top-fixed-wrap">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-title-row">
          <h1>지휘관 자격인증제 평가</h1>
          <a id="reviewLink" class="review-link-btn disabled" href="#" aria-disabled="true">
            📊 결과 분석
          </a>
        </div>
        <div class="topbar-sub">
          <div id="tokenInfo" class="token-box">토큰 확인 중...</div>
        </div>
      </div>
    </header>

    <div id="topSummaryBar" class="score-wrap">
      <div class="score-inner">
        <div class="score-box">현재 총점<span id="currentScore">0</span></div>
        <div class="score-box">배점 합계<span id="maxTotalScore">0</span></div>
      </div>
    </div>
  </div>

  <main class="container">
    <section class="card">
      <div class="title-row">
        <h2 id="sheetTitle" class="sheet-title">평가표 불러오는 중...</h2>
      </div>


      <div id="scoreTable"></div>

      <div class="comment-box">
        <label for="comment">비고 / 메모</label>
        <textarea id="comment" placeholder="필요한 경우만 입력"></textarea>
      </div>

      <p id="statusText" class="status-text"></p>
    </section>
  </main>

  <div class="bottom-bar">
    <div class="actions">
      <button id="resetBtn" class="action-btn secondary" type="button">초기화</button>
      <button id="submitBtn" class="action-btn" type="button">제출</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
